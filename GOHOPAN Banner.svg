<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="outerRound">
      <rect x="0" y="0" width="900" height="360" rx="12" ry="12"/>
    </clipPath>
    <clipPath id="clipCmd1">
      <rect x="195" y="60" width="0" height="24">
        <animate attributeName="width" calcMode="discrete"
          keyTimes="0.0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1.0"
          values="0;9;18;27;36;45;54;63;72;81;90;99;108"
          begin="0.8s" dur="0.96s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="clipCmd2">
      <rect x="195" y="86" width="0" height="24">
        <animate attributeName="width" calcMode="discrete"
          keyTimes="0.0;0.0238;0.0476;0.0714;0.0952;0.119;0.1429;0.1667;0.1905;0.2143;0.2381;0.2619;0.2857;0.3095;0.3333;0.3571;0.381;0.4048;0.4286;0.4524;0.4762;0.5;0.5238;0.5476;0.5714;0.5952;0.619;0.6429;0.6667;0.6905;0.7143;0.7381;0.7619;0.7857;0.8095;0.8333;0.8571;0.881;0.9048;0.9286;0.9524;0.9762;1.0"
          values="0;9;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171;180;189;198;207;216;225;234;243;252;261;270;279;288;297;306;315;324;333;342;351;360;369;378"
          begin="2.9s" dur="3.36s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#outerRound)">
    <!-- background -->
    <rect x="0" y="0" width="900" height="360" fill="#0c0c0c"/>

    <!-- title bar -->
    <rect x="0" y="0" width="900" height="34" fill="#2b2b2b"/>
    <text x="16" y="22" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#4ec9b0">&gt;_</text>
    <text x="38" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#cfcfcf">Command Prompt</text>

    <!-- windows caption buttons -->
    <g stroke="#cfcfcf" stroke-width="1.2" fill="none">
      <line x1="809" y1="17" x2="821" y2="17"/>
      <rect x="843" y="11" width="12" height="12"/>
      <line x1="877" y1="11" x2="889" y2="23"/>
      <line x1="889" y1="11" x2="877" y2="23"/>
    </g>

    <!-- line 1 (always visible) -->
    <text x="28" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c0c0c0">C:\Users\GOHOPAN&gt;</text>
    <text x="195" y="70" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e6e6e6" clip-path="url(#clipCmd1)">echo GOHOPAN</text>

    <!-- line 2 (appears after enter on line 1) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.86s" dur="0.15s" fill="freeze"/>
      <text x="28" y="96" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c0c0c0">C:\Users\GOHOPAN&gt;</text>
    </g>
    <text x="195" y="96" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#e6e6e6" clip-path="url(#clipCmd2)">echo AI ^| Frontend ^| Backend ^| Database</text>

    <!-- line 3 (final empty prompt, appears after enter on line 2) -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="6.36s" dur="0.15s" fill="freeze"/>
      <text x="28" y="122" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c0c0c0">C:\Users\GOHOPAN&gt;</text>
    </g>

    <!-- cursor -->
    <rect x="195" y="56" width="8" height="17" fill="#e6e6e6">
      <!-- single blink before typing starts -->
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" begin="0s" dur="0.8s" fill="freeze"/>

      <!-- move across while typing line 1 -->
      <animate attributeName="x" calcMode="discrete"
        keyTimes="0.0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1.0"
        values="195;204;213;222;231;240;249;258;267;276;285;294;303"
        begin="0.8s" dur="0.96s" fill="freeze"/>

      <!-- drop to line 2, reset x -->
      <set attributeName="x" to="195" begin="2.0s" fill="freeze"/>
      <set attributeName="y" to="82" begin="2.0s" fill="freeze"/>

      <!-- single blink before typing line 2 -->
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" begin="2.1s" dur="0.8s" fill="freeze"/>

      <!-- move across while typing line 2 -->
      <animate attributeName="x" calcMode="discrete"
        keyTimes="0.0;0.0238;0.0476;0.0714;0.0952;0.119;0.1429;0.1667;0.1905;0.2143;0.2381;0.2619;0.2857;0.3095;0.3333;0.3571;0.381;0.4048;0.4286;0.4524;0.4762;0.5;0.5238;0.5476;0.5714;0.5952;0.619;0.6429;0.6667;0.6905;0.7143;0.7381;0.7619;0.7857;0.8095;0.8333;0.8571;0.881;0.9048;0.9286;0.9524;0.9762;1.0"
        values="195;204;213;222;231;240;249;258;267;276;285;294;303;312;321;330;339;348;357;366;375;384;393;402;411;420;429;438;447;456;465;474;483;492;501;510;519;528;537;546;555;564;573"
        begin="2.9s" dur="3.36s" fill="freeze"/>

      <!-- drop to line 3, reset x -->
      <set attributeName="x" to="195" begin="6.5s" fill="freeze"/>
      <set attributeName="y" to="108" begin="6.5s" fill="freeze"/>

      <!-- final calm blink, settles here, no more content changes -->
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" begin="6.6s" dur="1.06s" repeatCount="indefinite"/>
    </rect>

    <!-- divider -->
    <line x1="24" y1="146" x2="876" y2="146" stroke="#ffffff" stroke-width="1.2" opacity="0.45"/>

    <!-- output: name (appears instantly, no animation, 0.2s after enter) -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="2.36s" fill="freeze"/>
      <text x="450" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="80" font-weight="800" fill="#ffffff">GOHOPAN</text>
    </g>

    <!-- output: role (appears instantly, no animation, 0.2s after enter) -->
    <g opacity="0">
      <set attributeName="opacity" to="1" begin="6.86s" fill="freeze"/>
      <text x="450" y="305" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="24" letter-spacing="1" fill="#3ddc97">AI | Frontend | Backend | Database</text>
    </g>
  </g>

  <!-- border -->
  <rect x="0.5" y="0.5" width="899" height="359" rx="12" ry="12" fill="none" stroke="#333333" stroke-width="1"/>
</svg>
